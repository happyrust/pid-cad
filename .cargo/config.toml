# getrandom 0.3 (pulled by ahash via opencadcodec) needs this cfg to select its
# browser backend on wasm32-unknown-unknown, alongside its `wasm_js` feature
# (enabled in Cargo.toml for the wasm target). Without it the web build fails
# with "wasm32-unknown-unknown targets are not supported by default".
#
# `-Cstrip=none` overrides the release profile's `strip = true` for the wasm
# target only: stripping removes the `target_features` custom section, so
# `wasm-opt` can no longer see that `bulk-memory` is enabled and rejects the
# module's memory.fill/copy ops ("require bulk memory"). Native release binaries
# stay stripped; only the wasm keeps its feature section.
[target.wasm32-unknown-unknown]
rustflags = [
    '--cfg',
    'getrandom_backend="wasm_js"',
    '-Cstrip=none',
    # The debug UI build has a substantially deeper view-construction stack
    # than the optimized bundle. Keep modal construction from exhausting the
    # WebAssembly stack while developing with `trunk serve`.
    '-Clink-arg=-zstack-size=4194304',
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-Clink-arg=-Wl,--stack,16777216",
    "-Clink-arg=-Wl,--exclude-all-symbols",
]

# Large stack for deep DWG/scene recursion on Windows debug builds (the
# upstream default of 16 MiB overflows on the deepest sheets).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

# Thread stacks for everything cargo runs: the test harness's per-test threads
# overflow the 2 MiB default, and rustc reads the same variable for its own
# compiler thread -- on the nightly this fork builds with, `cargo check` stops
# with "thread 'rustc' has overflowed its stack" below 32 MiB, and upstream saw
# rustc 1.99 overflow 8 MiB compiling this crate in release on Windows/macOS.
# 64 MiB covers both, and is what the msvc binaries' main thread gets above.
# (Windows only reserves it.)
[env]
RUST_MIN_STACK = "67108864"
# UI tests render through iced_test, which picks wgpu by default. Several
# test threads opening GPU devices at once crash the driver (SIGSEGV, about
# every other parallel `cargo test` run); the software renderer is safe.
ICED_TEST_BACKEND = "tiny-skia"
