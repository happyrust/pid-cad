[package]
name = "OpenCADStudio"
version = "2026.46.0"
edition = "2021"
build = "build.rs"
default-run = "OpenCADStudio"
autotests = false

[workspace]
members = [
    "crates/ocs_acis",
    "crates/ocs_plugin_api",
    "crates/ocs_save",
    "crates/ocs_web_worker",
    "crates/dwg-thumbnailer",
    "crates/dwg-thumbnailer-win",
    "crates/ocs_collab",
    "crates/ocs_collab_server",
]

[features]
default = []
ifc = ["dep:acadifc"]
# M1 POC: embedded Bevy renderer for the 3D shaded-solid layer (desktop only,
# see docs/bevy-viewport-integration.md). Runtime opt-in via OCS_BEVY3D=1.
bevy3d = ["dep:bevy"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
# Offline validation of the same contracts published to automation clients.
jsonschema = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
calamine = "0.36.1"
base64 = "0.22"
semver = "1"
url = "2"
# wgpu-30 port: local fork of iced-rs/iced @ 23604ff (branch wgpu-30-port)
iced = { path = "../iced", features = ["image", "svg", "advanced", "canvas", "smol", "markdown"] }
iced_runtime = { path = "../iced/runtime" }
iced_core = { path = "../iced/core" }
iced_aw = { git = "https://github.com/HakanSeven12/iced_aw.git", branch = "agent/fix-iced-fonts", features = ["menu", "context_menu", "drop_down", "number_input"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
rfd = "0.17"
clap = { version = "4", features = ["derive", "string"] }
env_logger = "0.11"
# Log facade, already in the tree via wgpu/iced. Native writes through the
# env_logger above; the web build installs its own logger.
log = "0.4"
svgtypes = "0.15.3"
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "ae40a59", features = ["serde"] }
kernel = { package = "opencadkernel", git = "https://github.com/HakanSeven12/opencadkernel.git", rev = "353ffb2", features = ["brep", "offset"] }
ocs_acis = { path = "crates/ocs_acis" }
kernel-constraints = { package = "opencadkernel-constraints", git = "https://github.com/HakanSeven12/opencadkernel.git", rev = "353ffb2" }
graph = { package = "opencadgraph", git = "https://github.com/HakanSeven12/opencadgraph.git", rev = "5e4dc20" }
# Line-number patterns of the P&ID rules (io::pid_pipes); already in the tree
# via env_logger's env_filter.
regex = "1"
acadifc = { git = "https://github.com/OpenAEC-Foundation/acadifc.git", rev = "47b5603", optional = true }
dwg-thumbnailer = { path = "crates/dwg-thumbnailer" }
# Shared SAVE serialization dispatch + web-worker wire format: one
# implementation for the inline (fallback/native) path and the worker path.
ocs_save = { path = "crates/ocs_save" }
# Collaboration: the shared protocol crate carries the wire shapes and the
# permission/occupancy rules, and the desktop client drives them over a
# *blocking* tungstenite socket (see `src/app/collab/transport.rs`). Deliberately
# no async runtime: the sync client keeps `tokio` out of this dependency tree
# (VAL-CLI-019), which `tokio-tungstenite` would not.
ocs_collab = { path = "crates/ocs_collab" }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
flate2 = "1"
# Raster decode set: png/jpeg/bmp/tiff plus webp/gif (both pure-Rust in
# image 0.25, so the wasm target stays C-free). Every format named here must
# also appear in the IMAGE picker filter (io::pick_image_file) and the web
# drop filter (io::web_drop::is_image_name).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
hayro = "0.7.1"
kurbo = "0.13"
# Pure-Rust CRS resolution and projection for document GEODATA. The embedded
# EPSG data runs on native and wasm; the WKT parser is native-only (below).
proj4rs = { version = "0.3", default-features = false, features = ["crs-definitions", "wasm-strict"] }
crs-definitions = "0.6"
# DWF/DWFx packages, their XPS pages and DWF/DGN underlay rasters.
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
encoding_rs = "0.8"
tiny-skia = "0.11"
# PDF writer shared by desktop export and the web export/preview/print path.
printpdf = { version = "0.9.1", default-features = false, features = ["images"] }
# Direct access to the page dictionaries and classic-xref serializer used for
# opt-in, full-precision GeoPDF metadata (same version printpdf already uses).
lopdf = { version = "0.39.0", default-features = false }
# TrueType subsetting for searchable PDF text (same version printpdf itself
# uses, so no new binary enters the lockfile). Same feature set as printpdf's
# own allsorts use (pure-Rust flate backend) — the defaults would drag in the
# libz-sys C dependency. Pure Rust, so the web build embeds
# the same subsets.
allsorts = { version = "0.16", default-features = false, features = ["flate2_rust"] }
# Rasterises assets/logo.svg into the window icon at startup, so the taskbar
# icon comes from the same file every other build target does. Already in the
# tree behind iced's svg feature; named here only to use it directly.
resvg = { version = "0.45", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
inventory = "0.3"
rustc-hash = "2"
sha2 = "0.10"
# Encrypted PDF owner-password checks (already in the tree through other crates).
md-5 = "0.10"
aes = "0.8"
fontdb = "0.23"
ttf-parser = "0.25"
# TrueType interpreter for hint-reliant ("tricky") fonts such as DFKai-SB and
# MingLiU, whose raw outlines are missing strokes. Already in the tree (hayro).
skrifa = "0.42.1"
cosmic-text = "0.15"
unicode-bidi = "0.3"
lyon_tessellation = "1.0.20"
pollster = "0.4"
lru = { version = "0.16.4", default-features = false }

[dev-dependencies]
fluent-syntax = "0.12"
# Headless simulator for the xref_manager menu tests; taken from the same
# local wgpu-30 fork as `iced`, so the types line up (upstream pins the git
# rev 23604ff the fork branches from).
iced_test = { path = "../iced/test" }
# naga follows the wgpu-30 port (local iced fork); upstream still sits on 27.
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Globalization", "Win32_Security_Authentication_Identity", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings", "wayland"] }

# For `src/bin/ocs_launcher.rs` only (the .app's real CFBundleExecutable,
# see that file for why) — already in the tree transitively via winit, pinned
# here to the same versions Cargo already resolves for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# The `NSEvent`/`block2` features are for the trackpad pinch monitor in
# `src/input/trackpad.rs` — see that file for why the gesture is read there.
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSFont", "NSResponder", "NSRunningApplication", "NSEvent", "block2"] }
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSURL", "NSString", "NSObject", "NSNotification", "NSThread", "NSEnumerator"] }

[patch.crates-io]
iced_core = { path = "../iced/core" }
iced_widget = { path = "../iced/widget" }
# pid-plot's pdfcraft (0e55d07) only builds against the hayro and lopdf
# copies patched inside that commit, which pid-parse mirrors under
# vendor/pdfcraft-pin. A dependency's own [patch] does not reach this graph,
# so the same four trees are named here, fetched from the same pid-parse
# commit. hayro* are the versions the PDF import already uses; lopdf 0.45
# is pdfcraft's alone (printpdf stays on 0.39).
hayro = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }
hayro-interpret = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }
hayro-syntax = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }
lopdf = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
ocs_plugin_api = { path = "crates/ocs_plugin_api", features = ["host"] }
bincode = "1.3"
meshopt = "0.6.2"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }
rayon = "1"
open = "5"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
# SmartPlant / Smart P&ID `.pid` reader, pinned to the public GitHub repo.
# Native-only: it reaches SQL Server backups through a bundled sqlite3 and
# the vendored `oxidized-mdf`, neither of which builds for wasm.
pid-parse = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }
# PIDPLOT: pid-parse's own paper plot of a `.pid` (border template, library
# symbol bodies, the sheet's typefaces subset in) written to PDF by pdfcraft.
pid-plot = { git = "https://github.com/happyrust/pid-parse", rev = "a85fa10285cc5379953495fa391f374981b9e587" }
# Embedded 3D renderer (M1 POC): local bevy main checkout, windowless, on
# iced's shared wgpu device. Feature-sliced to PBR + assets — no winit, no
# audio, no UI. `tonemapping_luts`+`zstd_rust` feed the default tonemapper.
bevy = { path = "../bevy", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
], optional = true }
# Text inside SVG images (plugin charts: `DialogControl::Svg`). iced's `svg`
# feature leaves usvg without text shaping, so every <text> was dropped. Named
# here only to switch the renderer's `svg-text` feature on (wgpu and tiny-skia).
# Upstream names the iced-rs git rev; this fork builds against the local
# wgpu-30 port of the same rev, so the renderer comes from there too.
iced_renderer = { path = "../iced/renderer", features = ["svg-text"] }
# WKT to PROJ for GEODATA without an EPSG authority. Native-only: on wasm the
# crate always exports its own `main`, which breaks linking the web app.
proj4wkt = { version = "0.2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ocs_plugin_api = { path = "crates/ocs_plugin_api" }
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
rust-embed = { version = "8", features = ["debug-embed"] }
console_error_panic_hook = "0.1"
# ahash (via opencadcodec) pulls getrandom 0.3, which needs the `wasm_js` backend
# enabled to support wasm32-unknown-unknown (plus the matching rustflag in
# .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bincode = "1.3"
# =0.3.92: wgpu 30's vendored WebGPU bindings need the wasm-bindgen 0.2.115
# generation (see docs/wgpu-30-fork.md).
web-sys = { version = "=0.3.92", features = [
    "Window",
    "Storage",
    "StorageManager",
    "Navigator",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    # FileSystemFileHandle derefs to FileSystemHandle for the `name()`
    # getter the in-place save (io::fs_access) reads off a picked handle.
    "FileSystemHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "Url",
    "Response",
    # The wasm remote-raster fetch (image_model::fetch_remote_web) builds a
    # `Request` with an `AbortController` signal for its deadline; the fetch
    # rejection is classified via `DomException` (AbortError = timeout) and
    # the body size is pre-checked against the Content-Length `Headers`.
    "Request",
    "RequestInit",
    "AbortController",
    "AbortSignal",
    "DomException",
    "Headers",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "ErrorEvent",
    "Clipboard",
    # The web image paste reads `navigator.clipboard.read()` items
    # (sys::read_clipboard_image): their `types()`/`getType()` surface lives
    # on ClipboardItem.
    "ClipboardItem",
    "KeyboardEvent",
    "KeyboardEventInit",
    "EventInit",
    "EventTarget",
    "BeforeUnloadEvent",
    # COLORSCHEME SYSTEM resolves prefers-color-scheme through a media
    # query listener read at boot and on every re-run.
    "MediaQueryList",
    "console",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "Event",
    "ReadableStreamDefaultReader",
    "ReadableStream",
    # The ?file= boot deep link reads location.search and compares the link's
    # origin against the page's (io::web_link).
    "Location",
] }
iced = { path = "../iced", features = ["webgl", "fira-sans"] }

# Skip debug metadata in routine builds to reduce compiler and linker work.
# Restore the previous level with CARGO_PROFILE_DEV_DEBUG=1 or
# CARGO_PROFILE_TEST_DEBUG=1 when needed.
[profile.dev]
debug = 0
# A wildcard package override would also override build-time dependencies.
opt-level = 2

# Build-time dependencies do not need the runtime optimization level.
[profile.dev.build-override]
opt-level = 0

# Keep this list in sync with the root package and workspace members.
[profile.dev.package]
OpenCADStudio = { opt-level = 0 }
ocs_plugin_api = { opt-level = 0 }
ocs_save = { opt-level = 0 }
ocs_web_worker = { opt-level = 0 }
dwg-thumbnailer = { opt-level = 0 }
dwg-thumbnailer-win = { opt-level = 0 }

# Keep translation-resource and manifest parsing fast during macro expansion.
i18n-embed = { opt-level = 2 }
fluent-bundle = { opt-level = 2 }
fluent-syntax = { opt-level = 2 }
find-crate = { opt-level = 2 }
"toml:0.5.11" = { opt-level = 2 }

# meshopt's C++ build maps DEBUG=false to NDEBUG. Keep its C assertions.
[profile.dev.package.meshopt]
debug = 1

[profile.test]
debug = 0

[profile.release]
strip = true

# pid-parse's sheet probe is hash-map heavy; unoptimized it takes ~290 ms to
# parse a dense drawing like DWG-0201 in a debug build, ~80 ms at opt-level 2.
[profile.dev.package.pid-parse]
opt-level = 2

# The codec (acadrust, under opencaddocument) unoptimized reads a 5 MB DWG in
# ~240 ms and writes it back as DXF in ~570 ms; at opt-level 2 in ~90 / ~450 ms.
[profile.dev.package.acadrust]
opt-level = 2

