[package]
name = "OpenCADStudio"
version = "2026.36.0"
edition = "2021"
build = "build.rs"
default-run = "OpenCADStudio"

[workspace]
members = [
    "crates/ocs_plugin_api",
    "crates/ocs_web_worker",
    "crates/dwg-thumbnailer",
    "crates/dwg-thumbnailer-win",
    "crates/ocs_doc_api",
]

[features]
default = []
ifc = ["dep:acadifc"]
# M1 POC: embedded Bevy renderer for the 3D shaded-solid layer (desktop only,
# see docs/bevy-viewport-integration.md). Runtime opt-in via OCS_BEVY3D=1.
bevy3d = ["dep:bevy"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
semver = "1"
# wgpu-30 port: local fork of iced-rs/iced @ 23604ff (branch wgpu-30-port)
iced = { path = "../iced", features = ["image", "svg", "advanced", "canvas", "smol", "markdown"] }
iced_runtime = { path = "../iced/runtime" }
iced_core = { path = "../iced/core" }
iced_aw = { git = "https://github.com/HakanSeven12/iced_aw.git", branch = "agent/fix-iced-fonts", features = ["menu", "context_menu", "color_picker", "drop_down"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
rfd = "0.17"
clap = { version = "4", features = ["derive", "string"] }
env_logger = "0.11"
# Log facade, already in the tree via wgpu/iced. Native writes through the
# env_logger above; the web build installs its own logger.
log = "0.4"
acadrust = { git = "https://github.com/HakanSeven12/cadcodec.git", rev = "7b4c112bd7895fe9039514c21c5b5aa59eaf2525", features = ["serde"] }
cadkernel = { git = "https://github.com/HakanSeven12/cadkernel.git", rev = "8efd43cb2f04577d20c3ee33ce5273bb49affa3d", features = ["acis", "offset"] }
acadifc = { git = "https://github.com/OpenAEC-Foundation/acadifc.git", rev = "47b5603", optional = true }
dwg-thumbnailer = { path = "crates/dwg-thumbnailer" }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
# Rasterises assets/logo.svg into the window icon at startup, so the taskbar
# icon comes from the same file every other build target does. Already in the
# tree behind iced's svg feature; named here only to use it directly.
resvg = { version = "0.45", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
inventory = "0.3"
rustc-hash = "2"
sha2 = "0.10"
fontdb = "0.23"
ttf-parser = "0.25"
cosmic-text = "0.15"
lyon_tessellation = "1.0.20"

[dev-dependencies]
fluent-syntax = "0.12"
# naga follows the wgpu-30 port (local iced fork); upstream still sits on 27.
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "wayland"] }

# For `src/bin/ocs_launcher.rs` only (the .app's real CFBundleExecutable,
# see that file for why) — already in the tree transitively via winit, pinned
# here to the same versions Cargo already resolves for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSURL", "NSString", "NSObject", "NSNotification", "NSThread", "NSEnumerator"] }

[patch.crates-io]
iced_core = { path = "../iced/core" }
iced_widget = { path = "../iced/widget" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
ocs_plugin_api = { path = "crates/ocs_plugin_api", features = ["host"] }
ocs_doc_api = { path = "crates/ocs_doc_api", features = ["host", "ipc"] }
bincode = "1.3"
meshopt = "0.6.2"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }
rayon = "1"
open = "5"
printpdf = { version = "0.9.1", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
# SmartPlant / Smart P&ID `.pid` reader. Native-only: it reaches SQL Server
# backups through a bundled sqlite3 and the vendored `oxidized-mdf`, neither
# of which builds for wasm.
pid-parse = { path = "../pid-parse" }
# Embedded 3D renderer (M1 POC): local bevy main checkout, windowless, on
# iced's shared wgpu device. Feature-sliced to PBR + assets — no winit, no
# audio, no UI. `tonemapping_luts`+`zstd_rust` feed the default tonemapper.
bevy = { path = "../bevy", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ocs_plugin_api = { path = "crates/ocs_plugin_api" }
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
rust-embed = { version = "8", features = ["debug-embed"] }
console_error_panic_hook = "0.1"
# ahash (via acadrust) pulls getrandom 0.3, which needs the `wasm_js` backend
# enabled to support wasm32-unknown-unknown (plus the matching rustflag in
# .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bincode = "1.3"
# =0.3.92: wgpu 30's vendored WebGPU bindings need the wasm-bindgen 0.2.115
# generation (see docs/wgpu-30-fork.md).
web-sys = { version = "=0.3.92", features = [
    "Window",
    "Storage",
    "StorageManager",
    "Navigator",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "Url",
    "Response",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "ErrorEvent",
    "Clipboard",
    "KeyboardEvent",
    "KeyboardEventInit",
    "EventInit",
    "EventTarget",
    "BeforeUnloadEvent",
    "console",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
] }
iced = { path = "../iced", features = ["webgl", "fira-sans"] }

[profile.release]
strip = true
