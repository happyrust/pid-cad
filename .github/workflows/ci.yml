name: Workspace check

# Compile gate on Linux, Windows and macOS. This fork keeps iced, cryoglyph,
# bevy and the e3d readers beside the repository as path dependencies; the
# shared action materialises them at the pinned commits first.
#
# The workspace test targets currently lag the pinned dependency APIs, so the
# test run is informational until those sources are updated; the compile step
# is the blocking gate. The lint job follows the same non-blocking rule.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          path: pid-cad

      # This fork keeps iced, bevy and the e3d readers beside the repository
      # as path dependencies; materialise them before cargo runs.
      - uses: ./pid-cad/.github/actions/checkout-fork-deps

      # The same libraries the Linux release build needs (windowing, GL,
      # fonts); the packaging tools are left out.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pid-cad -> target

      - name: cargo check
        working-directory: pid-cad
        run: cargo check --workspace --locked

      # LC_ALL=C: a few tests compare English message text. The GPU-backed
      # tests are #[ignore]d and need an adapter, so they do not run here.
      - name: cargo test (informational)
        if: runner.os == 'Linux'
        working-directory: pid-cad
        continue-on-error: true
        env:
          LC_ALL: C
        run: cargo test --workspace --locked

  lint:
    name: lint (informational)
    runs-on: ubuntu-22.04
    # Non-blocking until the existing tree is cleaned up. The tree currently has
    # thousands of rustfmt diffs and several clippy warnings and errors, so
    # these checks report in the log without failing the job: a job-level
    # continue-on-error still shows a red check on every pull request.
    steps:
      - uses: actions/checkout@v4
        with:
          path: pid-cad

      - uses: ./pid-cad/.github/actions/checkout-fork-deps

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pid-cad -> target

      - name: cargo fmt --check
        working-directory: pid-cad
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: pid-cad
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked
