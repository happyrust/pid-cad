[package]
name = "ocs_collab_server"
version = "0.1.0"
edition = "2021"
publish = false

# Collaboration server binary: axum HTTP control plane + WebSocket data plane,
# with rusqlite persistence. The protocol and the pure state machines live in
# `ocs_collab`; nothing here is shared with the desktop client.

[dependencies]
ocs_collab = { path = "../ocs_collab" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The same rusqlite line as pid-parse: the workspace resolves into one graph,
# and only one package in a graph may link sqlite3. `bundled` and `cache` are
# what 0.39 gave this crate; 0.41's other default is a wasm32 shim.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
# Already in workspace Cargo.lock (used by other crates): enables native HTTPS/WSS (#69).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
